[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrotor-mpc-sim"
version = "1.0.0"
description = "Reproducible deterministic and chance-constrained MPC research workbench"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "PyYAML>=6",
    "matplotlib>=3.8",
    "plotly>=5.20",
]

[project.optional-dependencies]
qp = ["cvxpy>=1.5", "clarabel>=0.9", "osqp>=0.6"]
ui = ["casadi>=3.6", "do-mpc>=4.6", "streamlit>=1.35", "graphviz>=0.20"]
mujoco = ["mujoco>=3.2"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
full = [
    "cvxpy>=1.5", "clarabel>=0.9", "osqp>=0.6",
    "casadi>=3.6", "do-mpc>=4.6", "streamlit>=1.35", "graphviz>=0.20",
    "mujoco>=3.2", "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ccmpc*", "simulation*", "experiments*", "reporting*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
