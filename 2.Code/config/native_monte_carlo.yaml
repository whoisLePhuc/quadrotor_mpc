name: native-ccmpc-monte-carlo
base_config: mujoco_native_ccmpc.yaml
output_dir: ../outputs/native_monte_carlo

# Paired ordering: every controller receives the same seed at each uncertainty
# level. Fifty trials match the reference experimental protocol and exceed the
# minimum of 30 required for descriptive Monte Carlo claims.
trials: 50
first_seed: 1000
modes:
  - deterministic
  - individual
  - joint

# These are covariance multipliers. The implementation multiplies every
# affected standard deviation by sqrt(covariance_scale).
noise_levels:
  - label: quarter_sigma
    covariance_scale: 0.25
  - label: nominal_sigma
    covariance_scale: 1.0
  - label: four_sigma
    covariance_scale: 4.0

statistics:
  confidence_level: 0.95
  minimum_trials_for_claim: 30

validation:
  # This is an empirical finite-sample gate, not an interpretation of the
  # per-horizon joint risk budget as an episode-wide probability.
  empirical_collision_rate_limit: 0.10
  require_zero_positive_slack: true
  require_zero_fallback: true
  require_zero_budget_failures: true
  timing_percentile: 0.99

