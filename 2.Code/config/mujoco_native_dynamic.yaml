name: nmpc-mujoco-native-dynamic-crossing

start:
  x: 0.0
  y: 0.0
  z: 1.0
  roll: 0.0
  pitch: 0.0
  yaw: 0.0

goal:
  position: {x: 3.0, y: 2.0, z: 2.5}
  euler: {roll: 0.0, pitch: 0.0, yaw: 0.7853981633974483}

controller:
  bounds:
    thrust: 0.085
    torque_rp: 0.002
    torque_yaw: 0.0004
  safety_margin: 0.30
  covariance_propagation:
    enabled: false
    mode: open_loop
  chance_constraints:
    enabled: false
    type: spherical
    individual_epsilon: 0.05
    soft_constraint: true
    slack_penalty: 1000000.0

simulation:
  duration_s: 10.0
  mpc_timestep_s: 0.05
  mujoco_timestep_s: 0.002
  horizon_steps: 20
  max_solver_iterations: 60
  stop_on_goal: false
  goal_tolerance_m: 0.25
  stop_on_collision: false

# Disabled here so this scenario remains the deterministic NMPC baseline.
estimation:
  enabled: false
  type: error_state_ekf
  seed: 7

viewer:
  camera_mode: follow
  distance: 7.0
  azimuth: 60.0
  elevation: -30.0
  realtime_factor: 1.0
  show_trail: true
  show_prediction: true
  show_obstacle_prediction: true
  show_safety_envelopes: true
  show_contacts: false
  max_trail_points: 600
  max_trail_segments: 240
  status_every_steps: 10

panel:
  enabled: true
  update_hz: 15.0
  history_seconds: 30.0
  stop_when_closed: true
  maximum_alerts: 12

recording:
  enabled: true
  output_dir: outputs/native
  max_buffer_samples: 5000

obstacles:
  - name: static_gate
    type: static
    position: [1.45, 1.05, 2.00]
    radius: 0.40

  - name: crossing_constant_velocity
    type: dynamic
    radius: 0.24
    motion:
      type: constant_velocity
      initial_position: [1.85, -0.80, 1.80]
      velocity: [0.0, 0.38, 0.0]

  - name: vertical_sinusoid
    type: dynamic
    radius: 0.20
    motion:
      type: sinusoidal
      center: [2.35, 1.55, 2.10]
      amplitude: [0.0, 0.0, 0.45]
      period_s: 4.5
      phase_rad: 0.0
